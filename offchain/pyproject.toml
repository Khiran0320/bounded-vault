[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bounded-vault-offchain"
version = "0.1.0"
description = "Off-chain agent layer for the bounded-vault DeFi project"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2",
    "pandas>=2",
    "anthropic",
    "python-dotenv",
    "httpx",
    "pyarrow",
    "matplotlib",
]


[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]